; Beam sensor: a Wemos D1 Mini that reports beam events to the controller over WiFi.
;   pio run -d firmware/beam-sensor -t upload --upload-port /dev/cu.usbserial-XXXX
; WiFi and the controller's name come from the repo's secrets.ini; the detector lives in the repo's lib/.
[platformio]
default_envs = d1_mini
lib_dir = ../../lib
extra_configs = ../../secrets.ini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson
    links2004/WebSockets
monitor_speed = 115200
upload_speed = 460800

; Bench self-test: emitter fed from D5 instead of 5V, always on (pio run -e d1_mini_selftest -t upload)
[env:d1_mini_selftest]
extends = env:d1_mini
build_flags = ${env.build_flags} -D BEAM_SELFTEST
