; Beam-sensor sketch. Separate from the controller firmware. Default board is a Wemos D1 Mini; the Uno R4 Minima still works.
;   cd tools/train/sensor && pio run -t upload            (D1 Mini)
;   cd tools/train/sensor && pio run -e uno_r4_minima -t upload
; (add `upload_port = /dev/cu.usbserial-XXXX` under an env if PlatformIO picks the wrong port)
[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Bench self-test: emitter fed from D5 instead of 5V, always on (pio run -e d1_mini_selftest -t upload)
[env:d1_mini_selftest]
extends = env:d1_mini
build_flags = -D BEAM_SELFTEST

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
