; Beam-sensor sketch for an Arduino Uno R4 Minima. Separate from the controller firmware.
;   cd tools/train/sensor && pio run -t upload
; (add `upload_port = /dev/cu.usbmodemXXXX` if PlatformIO picks the wrong port)
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
