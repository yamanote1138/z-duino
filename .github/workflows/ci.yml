name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  train-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: tools/train
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Create secrets stub
        run: cp secrets.ini.example secrets.ini
      - name: Compile
        run: pio run
      - name: Compile without the optional status LED
        run: PLATFORMIO_BUILD_FLAGS="-D HAS_STATUS_LED=0" pio run
      - name: Compile the beam sensor
        run: pio run -d firmware/beam-sensor -e d1_mini -e d1_mini_selftest
      - name: Run native unit tests
        run: pio test -e native
